spring.application.name=UrlShortener

# Datasource — usa variables de .env/Docker si existen, sino fallback a localhost para dev local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/url_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:url_admin}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:pruebita}}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Thymeleaf — sin cache en dev para ver cambios sin reiniciar
spring.thymeleaf.cache=false
