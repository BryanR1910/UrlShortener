<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Link Shortener</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <script th:src="@{/js/app.js}"></script>
  </head>
  <body>
    <header>
      <img th:src="@{/images/logo.svg}" alt="Logo de LinkShort" />
    </header>

    <div class="container">
      <section id="hero-section">
        <h1>Shorten Your Links, Simplify Your Sharing.</h1>
        <p>Fast, realiable, and simple URL shortening.</p>
      </section>

      <div class="shortener-container">
        <fieldset>
          <legend>Paste your long URL here...</legend>
          <input
            id="urlInput"
            type="text"
            placeholder="https://example.com/very/long/url..."
          />
        </fieldset>
        <button class="shorten-btn" onclick="createShortUrl()">Shorten</button>
      </div>

      <div class="urls-section">
        <div class="section-header">
          <h3>Recent Shortened URLs</h3>
          <span id="pageInfo"></span>
        </div>

        <div id="urlContainer"></div>

        <div class="pagination">
          <button class="page-btn" id="prevBtn" onclick="previousPage()">
            ← Prev
          </button>
          <button class="page-btn" id="nextBtn" onclick="nextPage()">
            Next →
          </button>
        </div>
      </div>
    </div>

    <div class="toast-layer">
      <div class="toast-stack" id="toastStack">
        <div id="errorToast" class="toast toast-error" role="status" aria-live="polite">
          <span class="toast-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
              <path d="M12 8v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              <circle cx="12" cy="16.5" r="1.2" fill="currentColor" />
            </svg>
          </span>
          <span id="errorMsg" class="toast-message"></span>
          <button type="button" class="toast-close" aria-label="Cerrar" onclick="dismissToast()">×</button>
        </div>
      </div>
    </div>
  </body>
</html>
